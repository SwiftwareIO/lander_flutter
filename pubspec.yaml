name: lander_flutter
description: "Deep linking without the fuss: receive, resolve and create Lander links, and report opens and conversions from Flutter apps."
version: 0.4.0
homepage: https://golander.link
repository: https://github.com/SwiftwareIO/lander_flutter
issue_tracker: https://github.com/SwiftwareIO/lander_flutter/issues
documentation: https://golander.link/docs
topics:
  - deep-linking
  - deferred-deep-linking
  - app-links
  - universal-links
  - dynamic-links

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  meta: ^1.11.0
  uuid: ^4.4.0

dev_dependencies:
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: link.lander.lander_flutter
        pluginClass: LanderFlutterPlugin
      ios:
        pluginClass: LanderFlutterPlugin
